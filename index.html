    <title>电子书编辑器 - 在线 EPUB/TXT 编辑与互转（纯前端）</title>
    <script defer src="./js/jszip.min.js?v=5"></script>
    <link rel="stylesheet" href="css/style.css?v=5" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "电子书编辑器",
        "url": "https://youwindy.github.io/ebook-editor/",
        "description": "纯前端、零后端的在线 EPUB / TXT 电子书编辑器：支持 EPUB 解析编辑、TXT 按正则拆章、EPUB 与 TXT 双向转换，所有处理均在浏览器本地完成。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "需要支持 ES6 的现代浏览器",
        "inLanguage": "zh-CN",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "CNY"
        }
      }
    </script>
  </head>
  <body class="mode-epub">
    <div class="app">
      <header class="topbar">
        <button type="button" class="icon-btn" id="menuBtn" aria-label="目录">
          ☰
        </button>
        <button
          type="button"
          class="icon-btn"
          id="findBtn"
          aria-label="查找替换"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.6-3.6" />
          </svg>
        </button>
        <h1 class="brand">EBOOK</h1>
        <div class="file-status" id="status">未打开文件</div>
        <input
          type="file"
          id="fileInput"
          accept=".epub,.txt,application/epub+zip,text/plain"
          hidden
        />
        <button type="button" class="btn" id="openBtn">打开</button>
        <button type="button" class="btn primary" id="saveBtn" disabled>
          保存
        </button>
      </header>

      <div class="workspace">
        <section class="content">
          <details class="meta" id="metaPanel">
            <summary>书籍信息</summary>
            <div class="meta-grid">
              <div class="meta-field">
                <label>书名</label><input id="m-title" disabled />
              </div>
              <div class="meta-field">
                <label>作者</label><input id="m-creator" disabled />
              </div>
              <div class="meta-field">
                <label>语言</label><input id="m-language" disabled />
              </div>
              <div class="meta-field">
                <label>标识符</label><input id="m-identifier" disabled />
              </div>
            </div>
            <div class="meta-actions epub-only">
              <button type="button" class="btn-mini primary" id="epub-to-txt">
                导出为 TXT
              </button>
            </div>
          </details>

          <details class="meta txt-only" id="txtPanel" open>
            <summary>TXT 拆章</summary>
            <div class="txt-panel-body">
              <div class="meta-field">
                <label>章节正则（每行匹配一个标题）</label>
                <input
                  id="txt-pattern"
                  spellcheck="false"
                  autocomplete="off"
                  autocapitalize="off"
                />
              </div>
              <div class="txt-panel-row">
                <div class="meta-field">
                  <label>flags</label>
                  <input
                    id="txt-flags"
                    value="m"
                    spellcheck="false"
                    autocomplete="off"
                  />
                </div>
                <div class="meta-field">
                  <label>编码</label>
                  <select id="txt-encoding">
                    <option value="auto">自动</option>
                    <option value="utf-8">UTF-8</option>
                    <option value="gbk">GBK</option>
                  </select>
                </div>
              </div>
              <div class="txt-panel-actions">
                <button type="button" class="btn-mini" id="txt-resplit">
                  重新拆章
                </button>
                <span class="txt-split-info" id="txt-split-info">共 0 章</span>
                <button type="button" class="btn-mini primary" id="txt-to-epub">
                  导出为 EPUB
                </button>
              </div>
              <label class="txt-check">
                <input type="checkbox" id="txt-preview-html" />
                预览按 HTML 渲染
              </label>
            </div>
          </details>

          <div class="findbar" id="findbar" hidden>
            <div class="findbar-head">
              <div class="mode-toggle" id="modeToggle">
                <button type="button" data-mode="regex" class="active">
                  正则
                </button>
                <button type="button" data-mode="text">文本</button>
              </div>
              <span class="re-summary" id="re-summary">—</span>
              <button
                type="button"
                class="icon-btn xs"
                id="findClose"
                aria-label="关闭"
              >
                ✕
              </button>
            </div>

            <div class="findbar-body">
              <div class="re-row" id="row-find">
                <input
                  type="text"
                  id="re-pattern"
                  placeholder="输入正则或文本"
                  autocomplete="off"
                  autocapitalize="off"
                  autocorrect="off"
                  spellcheck="false"
                />
                <button type="button" class="row-btn solid" id="find-run">
                  查找
                </button>
                <button
                  type="button"
                  class="row-btn nav-btn"
                  id="find-prev"
                  aria-label="上一个"
                  title="上一个 (Shift+Enter)"
                >
                  ▲
                </button>
                <button
                  type="button"
                  class="row-btn nav-btn"
                  id="find-next"
                  aria-label="下一个"
                  title="下一个 (Enter)"
                >
                  ▼
                </button>
                <button
                  type="button"
                  class="row-btn flag"
                  id="scope-all"
                  title="搜索全部章节"
                >
                  全
                </button>
                <button
                  type="button"
                  class="row-btn flag"
                  data-flag="i"
                  title="忽略大小写"
                >
                  i
                </button>
                <button
                  type="button"
                  class="row-btn flag"
                  data-flag="m"
                  title="多行 ^ $"
                >
                  m
                </button>
                <button
                  type="button"
                  class="row-btn flag"
                  data-flag="s"
                  title=". 匹配换行"
                >
                  s
                </button>
              </div>

              <div class="re-row" id="row-replace">
                <input
                  type="text"
                  id="re-replace"
                  placeholder="替换为"
                  autocomplete="off"
                  autocapitalize="off"
                  autocorrect="off"
                  spellcheck="false"
                />
                <button type="button" class="row-btn solid" id="re-replace-one">
                  替换
                </button>
                <button
                  type="button"
                  class="row-btn primary"
                  id="re-replace-all"
                >
                  全部
                </button>
              </div>

              <div class="re-matches" id="re-matches">
                <div class="re-hint">输入内容开始匹配</div>
              </div>
            </div>
          </div>

          <div class="tabs" id="tabs">
            <button type="button" class="tab active" data-tab="code">
              源码
            </button>
            <button type="button" class="tab" data-tab="preview">预览</button>
          </div>

          <div class="panes">
            <div class="pane show" id="pane-code">
              <textarea
                id="editor"
                placeholder="在目录里选一章开始编辑…"
                disabled
                spellcheck="false"
                autocapitalize="off"
                autocorrect="off"
              ></textarea>
            </div>
            <div class="pane" id="pane-preview">
              <iframe
                id="preview"
                title="章节预览"
                sandbox="allow-same-origin"
              ></iframe>
            </div>
          </div>
        </section>
      </div>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
      <button type="button" class="bn-item" data-nav="toc">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h10" />
        </svg>
        <span>目录</span>
      </button>
      <button type="button" class="bn-item active" data-nav="code">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 8l-4 4 4 4M15 8l4 4-4 4" />
        </svg>
        <span>源码</span>
      </button>
      <button type="button" class="bn-item" data-nav="preview">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z" />
          <circle cx="12" cy="12" r="2.5" />
        </svg>
        <span>预览</span>
      </button>
    </nav>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <span class="drawer-title">目录</span>
        <button
          type="button"
          class="drawer-close"
          id="closeDrawer"
          aria-label="关闭目录"
        >
          ✕
        </button>
      </div>
      <div class="toc" id="toc">
        <div class="empty">打开一个 EPUB<br />开始编辑</div>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <div class="drop-overlay" id="dropOverlay">
      <div class="drop-overlay-inner">松开以打开 EPUB</div>
    </div>

    <script defer src="js/utils.js?v=5"></script>
    <script defer src="js/state.js?v=5"></script>
    <script defer src="js/epub.js?v=5"></script>
    <script defer src="js/txt.js?v=5"></script>
    <script defer src="js/convert.js?v=5"></script>
    <script defer src="js/editor.js?v=5"></script>
    <script defer src="js/search.js?v=5"></script>
    <script defer src="js/app.js?v=5"></script>
  </body>
</html>
